name: Deploy PKU-3D
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', 'scripts/**', 'VERSION', 'LICENSE', 'DATA_LICENSE.md', '.github/workflows/pages.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore published scene assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/assets.py setup
      - name: Build website
        run: python3 app/build.py --cached
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
