name: 体验与建议
description: 页面问题、使用感受或新想法
title: "[体验反馈] "
body:
  - type: textarea
    id: detail
    attributes:
      label: 你遇到了什么？
      description: 发生在哪一步，希望怎样改进？
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 使用环境（可选）
      placeholder: 例如：Mac · Chrome，或 iPhone · Safari
