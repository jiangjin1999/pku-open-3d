name: 校园纠错
description: 帮助校对建筑、入口、院落或道路
title: "[校园纠错] "
body:
  - type: markdown
    attributes:
      value: "这里是公开 Issue。请只附模型截图和可公开说明，不要上传实景原照、私有资料包或提交凭证。照片请通过项目网站的匿名贡献入口提供，入口状态见 README。"
  - type: input
    id: place
    attributes:
      label: 地点名称
      placeholder: 例如：19 号楼西门
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: 哪里不对？正确的关系是什么？
      description: 尽量说明方向、相邻建筑或入口位置；可以拖入圈注截图。
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: 可选的参考依据
      description: 可公开的亲历描述或合法公开资料链接；注明方向与时间。实景原照请使用网站私有贡献入口。
